version: "3.8"

services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-server
    ports:
      - "7777:7777" # 호스트:컨테이너 포트 매핑
    restart: unless-stopped # 컨테이너가 종료되면 자동 재시작
    command: ["./server", "7777"] # 7777 포트로 서버 실행
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
